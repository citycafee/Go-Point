<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Settings - City Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#2e8b57",
            secondary: "#3cb371",
            accent: "#ff6b35",
            light: "#F5F8FA",
            dark: "#1A2838",
            background: "#FFFFFF",
            card: "#FFFFFF",
            textPrimary: "#1A2838",
            textSecondary: "#6B7280",
          },
        },
      },
    };
  </script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f5f8fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Switch toggle styles */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #2e8b57;
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    /* Modal styles */
    .settings-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .settings-content-container {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 56rem;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
    }

    .settings-tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #e2e8f0;
    }

    .settings-tab {
      flex: 1;
      padding: 0.75rem 1rem;
      text-align: center;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 0.5rem 0.5rem 0 0;
      border: 2px solid transparent;
      border-bottom: none;
      margin-bottom: -2px;
    }

    .settings-tab.active {
      background: #2e8b57;
      color: white;
      border-color: #2e8b57;
    }

    .settings-tab:not(.active):hover {
      background: #f1f5f9;
    }

    .settings-panel {
      display: none;
    }

    .settings-panel.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #374151;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #2e8b57;
      box-shadow: 0 0 0 3px rgba(46, 139, 87, 0.1);
    }

    .delivery-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .delivery-option:last-child {
      border-bottom: none;
    }

    .btn-primary {
      background: #2e8b57;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #3cb371;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .close-btn {
      font-size: 1.5rem;
      color: #6b7280;
      cursor: pointer;
      transition: color 0.2s;
      line-height: 1;
    }

    .close-btn:hover {
      color: #374151;
    }

    .restaurant-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      background: #f9fafb;
    }

    .restaurant-item img {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 9999px;
      margin-right: 0.75rem;
    }

    .restaurant-info h4 {
      font-weight: 600;
      color: #1f2937;
    }

    .restaurant-info p {
      font-size: 0.875rem;
      color: #6b7280;
    }

    .restaurant-actions {
      display: flex;
      gap: 0.5rem;
    }

    .restaurant-actions button {
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.875rem;
      transition: color 0.2s;
    }

    .restaurant-actions .edit-btn {
      color: #3b82f6;
    }

    .restaurant-actions .edit-btn:hover {
      color: #2563eb;
    }

    .restaurant-actions .delete-btn {
      color: #ef4444;
    }

    .restaurant-actions .delete-btn:hover {
      color: #dc2626;
    }

    .add-restaurant-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #16a34a;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 500;
      margin-bottom: 1rem;
      transition: background 0.2s;
    }

    .add-restaurant-btn:hover {
      background: #15803d;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    @media (max-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      
      .settings-tabs {
        flex-direction: column;
        border-bottom: none;
      }
      
      .settings-tab {
        border-radius: 0.5rem;
        margin-bottom: 0.25rem;
        border: 2px solid transparent;
      }
      
      .settings-tab.active {
        border-color: #2e8b57;
      }
    }
  </style>
</head>
<body>
  <!-- Settings Modal -->
  <div class="settings-modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="settings-content-container">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-2xl font-bold text-primary" id="settingsModalTitle">Settings</h3>
        <button class="close-btn" onclick="closeSettings()" aria-label="Close settings modal">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <!-- Settings Tabs -->
      <div class="settings-tabs" role="tablist">
        <button class="settings-tab active" data-tab="restaurants" id="tab-restaurants" role="tab" aria-selected="true" aria-controls="restaurantsTab" type="button">
          <i class="fas fa-utensils mr-2"></i>Restaurants
        </button>
        <button class="settings-tab" data-tab="delivery" id="tab-delivery" role="tab" aria-selected="false" aria-controls="deliveryTab" type="button">
          <i class="fas fa-truck mr-2"></i>Delivery Management
        </button>
        <button class="settings-tab" data-tab="system" id="tab-system" role="tab" aria-selected="false" aria-controls="systemTab" type="button">
          <i class="fas fa-cog mr-2"></i>System Settings
        </button>
      </div>
      
      <!-- Restaurants Tab Content -->
      <div id="restaurantsTab" class="settings-panel active" role="tabpanel" aria-labelledby="tab-restaurants">
        <h3 class="text-lg font-semibold mb-4 text-gray-800">Restaurant Management</h3>
        <button class="add-restaurant-btn" type="button" onclick="showRestaurantForm()">
          <i class="fas fa-plus"></i>
          Add New Restaurant
        </button>
        <div id="restaurantsList" tabindex="0" class="space-y-2">
          <!-- Sample Restaurant Items -->
          <div class="restaurant-item">
            <div class="flex items-center">
              <img src="https://placehold.co/40x40/2e8b57/FFFFFF?text=UB" alt="Urban Bistro logo"/>
              <div class="restaurant-info">
                <h4>Urban Bistro</h4>
                <p>123 Main St, Downtown</p>
              </div>
            </div>
            <div class="restaurant-actions">
              <button class="edit-btn" type="button" aria-label="Edit Urban Bistro">
                <i class="fas fa-edit"></i>
              </button>
              <button class="delete-btn" type="button" aria-label="Delete Urban Bistro">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
          <div class="restaurant-item">
            <div class="flex items-center">
              <img src="https://placehold.co/40x40/2e8b57/FFFFFF?text=GL" alt="Green Leaf Cafe logo"/>
              <div class="restaurant-info">
                <h4>Green Leaf Cafe</h4>
                <p>456 Park Ave, Midtown</p>
              </div>
            </div>
            <div class="restaurant-actions">
              <button class="edit-btn" type="button" aria-label="Edit Green Leaf Cafe">
                <i class="fas fa-edit"></i>
              </button>
              <button class="delete-btn" type="button" aria-label="Delete Green Leaf Cafe">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
          <div class="restaurant-item">
            <div class="flex items-center">
              <img src="https://placehold.co/40x40/2e8b57/FFFFFF?text=BJ" alt="Burger Junction logo"/>
              <div class="restaurant-info">
                <h4>Burger Junction</h4>
                <p>789 Food St, Westside</p>
              </div>
            </div>
            <div class="restaurant-actions">
              <button class="edit-btn" type="button" aria-label="Edit Burger Junction">
                <i class="fas fa-edit"></i>
              </button>
              <button class="delete-btn" type="button" aria-label="Delete Burger Junction">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Delivery Management Tab Content -->
      <div id="deliveryTab" class="settings-panel" role="tabpanel" aria-labelledby="tab-delivery" hidden>
        <h3 class="text-lg font-semibold mb-4 text-gray-800">Delivery Management</h3>
        
        <!-- Delivery Services -->
        <div class="mb-6 pb-4 border-b border-gray-200">
          <h4 class="font-semibold mb-3 text-gray-800">Delivery Services</h4>
          <div class="delivery-option">
            <label for="motorcycleDelivery" class="font-medium">Motorcycle Delivery</label>
            <label class="switch">
              <input type="checkbox" id="motorcycleDelivery" checked/>
              <span class="slider"></span>
            </label>
          </div>
          <div class="delivery-option">
            <label for="taxiDelivery" class="font-medium">Taxi Delivery</label>
            <label class="switch">
              <input type="checkbox" id="taxiDelivery" checked/>
              <span class="slider"></span>
            </label>
          </div>
        </div>
        
        <!-- Delivery Zones -->
        <div class="mb-6 pb-4 border-b border-gray-200">
          <h4 class="font-semibold mb-3 text-gray-800">Delivery Zones</h4>
          <div class="form-group">
            <label for="maxDeliveryDistance">Maximum Delivery Distance (km)</label>
            <input type="number" id="maxDeliveryDistance" min="1" value="10" class="w-full px-3 py-2 border border-gray-300 rounded-lg"/>
          </div>
          <div class="form-group">
            <label for="baseDeliveryFee">Base Delivery Fee ($)</label>
            <input type="number" id="baseDeliveryFee" min="0" step="0.5" value="2.00" class="w-full px-3 py-2 border border-gray-300 rounded-lg"/>
          </div>
          <div class="form-group">
            <label for="perKmFee">Per km Fee ($)</label>
            <input type="number" id="perKmFee" min="0" step="0.1" value="0.50" class="w-full px-3 py-2 border border-gray-300 rounded-lg"/>
          </div>
        </div>
        
        <!-- Delivery Hours -->
        <div class="mb-6">
          <h4 class="font-semibold mb-3 text-gray-800">Delivery Hours</h4>
          <div class="grid-2">
            <div class="form-group">
              <label for="deliveryStart">Start Time</label>
              <input type="time" id="deliveryStart" value="08:00" class="w-full px-3 py-2 border border-gray-300 rounded-lg"/>
            </div>
            <div class="form-group">
              <label for="deliveryEnd">End Time</label>
              <input type="time" id="deliveryEnd" value="22:00" class="w-full px-3 py-2 border border-gray-300 rounded-lg"/>
            </div>
          </div>
        </div>
        
        <div class="flex justify-end mt-4 pt-4 border-t border-gray-200">
          <button class="btn-primary" type="button" onclick="saveDeliverySettings()">
            Save Delivery Settings
          </button>
        </div>
      </div>
      
      <!-- System Settings Tab Content -->
      <div id="systemTab" class="settings-panel" role="tabpanel" aria-labelledby="tab-system" hidden>
        <h3 class="text-lg font-semibold mb-4 text-gray-800">System Settings</h3>
        <div class="mb-6">
          <h4 class="font-semibold mb-4 text-gray-800">General Settings</h4>
          <div class="form-group">
            <label for="businessName">Business Name</label>
            <input type="text" id="businessName" value="UQIQ Delivery" class="w-full px-3 py-2 border border-gray-300 rounded-lg"/>
          </div>
          <div class="form-group">
            <label for="businessAddress">Address</label>
            <input type="text" id="businessAddress" value="123 Business St, Cityville" class="w-full px-3 py-2 border border-gray-300 rounded-lg"/>
          </div>
          <div class="form-group">
            <label for="businessPhone">Phone Number</label>
            <input type="text" id="businessPhone" value="+1-555-0123" class="w-full px-3 py-2 border border-gray-300 rounded-lg"/>
          </div>
          <div class="form-group">
            <label for="businessEmail">Email</label>
            <input type="email" id="businessEmail" value="info@uqiqdelivery.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg"/>
          </div>
          <div class="form-group">
            <label for="minOrderValue">Minimum Order Value ($)</label>
            <input type="number" id="minOrderValue" min="0" step="0.5" value="5.00" class="w-full px-3 py-2 border border-gray-300 rounded-lg"/>
          </div>
          <div class="form-group">
            <label for="defaultOrderType">Default Order Type</label>
            <select id="defaultOrderType" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
              <option value="dine-in">Dine In</option>
              <option value="takeaway">Take Away</option>
              <option value="delivery" selected>Delivery</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end mt-4 pt-4 border-t border-gray-200">
          <button class="btn-primary" type="button" onclick="saveSystemSettings()">
            Save System Settings
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Tab switching functionality
    document.querySelectorAll('.settings-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabId = tab.dataset.tab;
        
        // Update tab buttons
        document.querySelectorAll('.settings-tab').forEach(t => {
          t.classList.remove('active');
          t.setAttribute('aria-selected', 'false');
        });
        tab.classList.add('active');
        tab.setAttribute('aria-selected', 'true');
        
        // Update panels
        document.querySelectorAll('.settings-panel').forEach(panel => {
          panel.classList.remove('active');
          panel.hidden = true;
        });
        const activePanel = document.getElementById(`${tabId}Tab`);
        activePanel.classList.add('active');
        activePanel.hidden = false;
      });
    });

    // Close settings modal
    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    // Show restaurant form (placeholder)
    function showRestaurantForm() {
      alert('Restaurant form would open here');
    }

    // Save delivery settings (placeholder)
    function saveDeliverySettings() {
      showNotification('Delivery settings saved successfully!');
    }

    // Save system settings (placeholder)
    function saveSystemSettings() {
      showNotification('System settings saved successfully!');
    }

    // Show notification
    function showNotification(message) {
      // Create notification element
      const notification = document.createElement('div');
      notification.className = 'fixed top-4 right-4 bg-green-600 text-white px-4 py-3 rounded-lg shadow-lg z-50 animate-slide-in';
      notification.innerHTML = `<i class="fas fa-check-circle mr-2"></i>${message}`;
      document.body.appendChild(notification);
      
      // Remove after 3 seconds
      setTimeout(() => {
        notification.style.opacity = '0';
        notification.style.transition = 'opacity 0.3s';
        setTimeout(() => notification.remove(), 300);
      }, 3000);
    }

    // Add CSS animation for notifications
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      .animate-slide-in {
        animation: slideIn 0.3s ease-out;
      }
    `;
    document.head.appendChild(style);

    // Close modal when clicking outside
    document.getElementById('settingsModal').addEventListener('click', (e) => {
      if (e.target.id === 'settingsModal') {
        closeSettings();
      }
    });

    // Close modal with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeSettings();
      }
    });
  </script>
</body>
</html>
